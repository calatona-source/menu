
<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Personalitzat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-yellow-100 to-orange-200 min-h-screen p-4">
  <div class="max-w-2xl mx-auto bg-white shadow-xl rounded-lg overflow-hidden">
    
    <!-- Imatge a la part superior -->
    <div>
      <img src="iamge.jpg" alt="Imatge del menú" class="w-full h-auto object-cover">
    </div>

    <!-- Formulari a sota -->
    <div class="p-6">
      <h1 class="text-3xl font-bold text-center text-orange-700 mb-4">Escull el teu menú</h1>
      <form action="mailto:calatona@gmail.com" method="POST" enctype="text/plain" class="space-y-4">
        <div>
          <label for="nom" class="block text-lg font-medium text-gray-700">Nom:</label>
          <input type="text" id="nom" name="Nom" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-orange-500 focus:border-orange-500">
        </div>

        <div>
          <label class="block text-lg font-medium text-gray-700">Primer plat:</label>
          <select name="Primer plat" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-orange-500 focus:border-orange-500">
            <option>Amanida amb fruits secs i formatge de cabra</option>
            <option>Amanida estil xató amb el nostre romesco</option>
            <option>Fideuà</option>
            <option>Assortit d’embotits artesans de la nostra botiga</option>
            <option>Sopa o crema de temporada</option>
            <option>Canelons</option>
          </select>
        </div>

        <div>
          <label class="block text-lg font-medium text-gray-700">Plat principal:</label>
          <select name="Plat principal" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-orange-500 focus:border-orange-500">
            <option>Gamba llagostinera a la planxa</option>
            <option>Conill a la brasa</option>
            <option>Botifarra de pagès de Sant Quirze</option>
            <option>Secret de porc a la brasa</option>
            <option>Secret de porc al Rocafort</option>
            <option>½ pollastre</option>
            <option>Entrecot de vaca a la brasa (350 g)</option>
            <option>Peus de porc a la brasa</option>
          </select>
        </div>

        <div class="text-center">
          <button type="submit" class="bg-orange-600 text-white px-6 py-2 rounded-md hover:bg-orange-700 transition">Enviar</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
