<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>19 de setembre!!!</title>


<script/cdn.tailwindcss.comscript>

</head>
<style>
body{
    background:#ede6d6;
}

.libreta{
    background:#fffdf8;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.plat input{
    display:none;
}

.plat input:checked + div{
    background:#dbeafe;
    border-color:#2563eb;
    transform:scale(1.02);
}

.plat div{
    transition:all .2s;
}

.fons-menu{
    background:
    linear-gradient(
        rgba(255,255,255,.94),
        rgba(255,255,255,.94)
    );
}
</style>

</head>

<body class="p-4 md:p-8">

<div class="max-w-5xl mx-auto">

<div class="libreta rounded-3xl overflow-hidden">

<div class="bg-stone-800 text-white text-center py-8">

<h1 class="text-4xl md:text-5xl font-bold">
19 de setembre !!!
</h1>

<div class="bg-amber-50 border-2 border-amber-200 rounded-xl p-5 mb-8">

    <label for="nombre" class="block text-xl font-bold text-stone-800 mb-2">
        👤 Nom i cognoms
    </label>

    <input
        id="nombre"
        name="nombre"
        type="text"
        required
        class="w-full p-4 text-lg border-2 border-amber-300 rounded-xl focus:outline-none focus:border-stone-600"
        placeholder="Escriu el teu nom i cognoms">

</div>
<p class="mt-2 text-stone-200">
Selecció de menú
</p>

</div>

<div class="p-6 md:p-10 fons-menu">

<div class="grid lg:grid-cols-2 gap-6 mb-10">

<img
src="menu_38.jpg"
alt="Menú"
class="w-full rounded-2xl shadow-lg border bg-white">

<img
src="al.lergens.jpg"
</div>

<form id="formulario" class="space-y-10"
<input
id="nombre"
required
type="text"
class="w-full p-4 rounded-xl border"
placeholder="Escriu el teu nom">

</div>

<div>

<h2 class="text-3xl font-bold text-stone-800 mb-5">
Entrant
</h2>

<div class="grid gap-3">

<label class="plat">
<input type="radio" name="entrante" value="Amanida amb fruits secs i formatge de cabra" required>
<div class="bg-white border-2 rounded-xl p-4">
🥗 Amanida amb fruits secs i formatge de cabra
</div>
</label>

<label class="plat">
<input type="radio" name="entrante" value="Amanida estil xató amb el nostre romesco">
<div class="bg-white border-2 rounded-xl p-4">
🥗 Amanida estil xató amb el nostre romesco
</div>
</label>

<label class="plat">
<input type="radio" name="entrante" value="Fideuà">
<div class="bg-white border-2 rounded-xl p-4">
🍝 Fideuà
</div>
</label>

<label class="plat">
<input type="radio" name="entrante" value="Assortit d'embotits artesans de la nostra botiga">
<div class="bg-white border-2 rounded-xl p-4">
🥓 Assortit d'embotits artesans
</div>
</label>

<label class="plat">
<input type="radio" name="entrante" value="Sopa o crema de temporada">
<div class="bg-white border-2 rounded-xl p-4">
🍲 Sopa o crema de temporada
</div>
</label>

<label class="plat">
<input type="radio" name="entrante" value="Canelons casolans">
<div class="bg-white border-2 rounded-xl p-4">
🧀 Canelons casolans
</div>
</label>

</div>

</div>

<div>

<h2 class="text-3xl font-bold text-stone-800 mb-5">
Principal
</h2>

<div class="grid gap-3">

<label class="plat">
<input type="radio" name="principal" value="Gambes a la planxa" required>
<div class="bg-white border-2 rounded-xl p-4">
🦐 Gambes a la planxa
</div>
</label>

<label class="plat">
<input type="radio" name="principal" value="Conill a la brasa">
<div class="bg-white border-2 rounded-xl p-4">
🔥 Conill a la brasa
</div>
</label>

<label class="plat">
<input type="radio" name="principal" value="Botifarra de pagès de Sant Quirze a la brasa">
<div class="bg-white border-2 rounded-xl p-4">
🌭 Botifarra de pagès a la brasa
</div>
</label>

<label class="plat">
<input type="radio" name="principal" value="Filet de porc a la brasa">
<div class="bg-white border-2 rounded-xl p-4">
🥩 Filet de porc a la brasa
</div>
</label>

<label class="plat">
<input type="radio" name="principal" value="Filet de porc al Rocafort">
<div class="bg-white border-2 rounded-xl p-4">
🧀 Filet de porc al Rocafort
</div>
</label>

<label class="plat">
<input type="radio" name="principal" value="1/2 Pollastre a la brasa">
<div class="bg-white border-2 rounded-xl p-4">
🍗 1/2 Pollastre a la brasa
</div>
</label>

<label class="plat">
<input type="radio" name="principal" value="Peus de porc a la brasa">
<div class="bg-white border-2 rounded-xl p-4">
🥘 Peus de porc a la brasa
</div>
</label>

</div>

</div>

<div>

<h2 class="text-3xl font-bold text-stone-800 mb-4">
Menú infantil
</h2>

<label class="flex gap-3 items-start bg-amber-50 border rounded-xl p-4">

<input id="infantil" type="checkbox" class="mt-1">

<span>
🍝 Macarrons a la bolonyesa, pollastre arrebossat,
patates fregides i postre.
</span>

</label>

</div>

<div>

<label class="flex gap-3 items-center font-semibold text-lg">

<input id="alergenos" type="checkbox">

⚠️ Tinc al·lèrgies o intoleràncies

</label>

<textarea
id="detalle"
rows="4"
class="w-full mt-4 border rounded-xl p-4"
placeholder="Indica aquí els al·lèrgens o observacions"></textarea>

</div>

<div class="text-center">

<button
type="submit"
class="bg-stone-800 hover:bg-black text-white px-10 py-4 rounded-xl text-lg">

Enviar selecció

</button>

</div>

</form>

<div
id="resultado"
class="hidden mt-8 p-6 rounded-xl bg-green-50 border border-green-300">
</div>

</div>

</div>

</div>

<script>

document.getElementById("formulario")
.addEventListener("submit",function(e){

e.preventDefault();

const dades = {

nom: document.getElementById("nombre").value,

entrant:
document.querySelector('input[name="entrante"]:checked')?.value,

principal:
document.querySelector('input[name="principal"]:checked')?.value,

infantil:
document.getElementById("infantil").checked
? "Sí"
: "No",

alergenos:
document.getElementById("detalle").value

};

localStorage.setItem(
"menuCalAtona",
JSON.stringify(dades)
);

const resultat =
document.getElementById("resultado");

resultat.classList.remove("hidden");

resultat.innerHTML = `
<h3 class="font-bold text-xl mb-3">
✅ Selecció enregistrada
</h3>

<p><strong>Nom:</strong> ${dades.nom}</p>
<p><strong>Entrant:</strong> ${dades.entrant}</p>
<p><strong>Principal:</strong> ${dades.principal}</p>
<p><strong>Menú infantil:</strong> ${dades.infantil}</p>
`;

window.scrollTo(
0,
document.body.scrollHeight
);

});

</script>

</body>
</html>
