<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Menú</title>

    https://cdn.tailwindcss.comscript>

    <style>
        body {
            background-color: #efe9dd;
        }

        .notebook {
            background: repeating-linear-gradient(
                to bottom,
                #fffef9,
                #fffef9 34px,
                #d8e4f3 35px
            );
        }

        .paper {
            box-shadow: 0 10px 35px rgba(0,0,0,.12);
        }

        .option-card input {
            display: none;
        }

        .option-card input:checked + div {
            background: #dbeafe;
            border-color: #2563eb;
            transform: scale(1.01);
        }

        .option-card div {
            transition: 0.2s;
        }
    </style>
</head>

<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto notebook paper rounded-xl p-6 md:p-10">

        <h1 class="text-4xl font-bold text-gray-800 mb-2">
            Selección de Menú
        </h1>

        <p class="text-gray-600 mb-8">
            Rellena el formulario para indicar tus preferencias.
        </p>

        <div class="grid md:grid-cols-2 gap-6 mb-8">

            <div>
                <img
                    src="menu_38.jpg"
                    alt="Menú"
                    class="rounded-lg shadow-lg w-full">
     "Alérgenos"
                    class="rounded-lg shadow-lg w-full">
            </div>

     bold mb-2">
                    Nombre y apellidos
                </label>

                <input
                    id="nombre"
                    required
                    type="text"
                    class="w-full border rounded-lg p-3 bg-white"
                    placeholder="Escribe tu nombre">
            </div>

            <div>

                <h2 class="text-2xl font-bold mb-4">
                    Entrantes
                </h2>

                <div class="grid gap-3">

                    <label class="option-card">
                        <input type="radio" name="entrante" value="Amanida amb fruits secs i formatge de cabra" required>
                        <div class="border bg-white p-3 rounded-lg">Amanida amb fruits secs i formatge de cabra</div>
                    </label>

                    <label class="option-card">
                        <input type="radio" name="entrante" value="Amanida estil xató amb el nostre romesco">
                        <div class="border bg-white p-3 rounded-lg">Amanida estil xató amb el nostre romesco</div>
                    </label>

                    <label class="option-card">
                        <input type="radio" name="entrante" value="Fideuà">
                        <div class="border bg-white p-3 rounded-lg">Fideuà</div>
                    </label>

                    <label class="option-card">
                        <input type="radio" name="entrante" value="Assortit d'embotits artesans de la nostra botiga">
                        <div class="border bg-white p-3 rounded-lg">Assortit d'embotits artesans de la nostra botiga</div>
                    </label>

                    <label class="option-card">
                        <input type="radio" name="entrante" value="Sopa o crema de temporada">
                        <div class="border bg-white p-3 rounded-lg">Sopa o crema de temporada</div>
                    </label>

                    <label class="option-card">
                        <input type="radio" name="entrante" value="Canelons casolans">
                        <div class="border bg-white p-3 rounded-lg">Canelons casolans</div>
                    </label>

                </div>

            </div>

            <div>

                <h2 class="text-2xl font-bold mb-4">
                    Principal
                </h2>

                <div class="grid gap-3">

                    <label class="option-card">
                        <input type="radio" name="principal" value="Gambes a la planxa" required>
                        <div class="border bg-white p-3 rounded-lg">Gambes a la planxa</div>
                    </label>

                    <label class="option-card">
                        <input type="radio" name="principal" value="Conill a la brasa">
                        <div class="border bg-white p-3 rounded-lg">Conill a la brasa</div>
                    </label>

                    <label class="option-card">
                        <input type="radio" name="principal" value="Botifarra de pagès de Sant Quirze a la brasa">
                        <div class="border bg-white p-3 rounded-lg">Botifarra de pagès de Sant Quirze a la brasa</div>
                    </label>

                    <label class="option-card">
                        <input type="radio" name="principal" value="Filet de porc a la brasa">
                        <div class="border bg-white p-3 rounded-lg">Filet de porc a la brasa</div>
                    </label>

                    <label class="option-card">
                        <input type="radio" name="principal" value="Filet de porc al Rocafort">
                        <div class="border bg-white p-3 rounded-lg">Filet de porc al Rocafort</div>
                    </label>

                    <label class="option-card">
                        <input type="radio" name="principal" value="1/2 Pollastre a la brasa">
                        <div class="border bg-white p-3 rounded-lg">1/2 Pollastre a la brasa</div>
                    </label>

                    <label class="option-card">
                        <input type="radio" name="principal" value="Peus de porc a la brasa">
                        <div class="border bg-white p-3 rounded-lg">Peus de porc a la brasa</div>
                    </label>

                </div>

            </div>

            <div>

                <h2 class="text-2xl font-bold mb-4">
                    Menú infantil
                </h2>

                <label class="flex gap-3 items-center bg-white border p-4 rounded-lg">
                    <input id="infantil" type="checkbox">
                    <span>
                        Macarrons a la bolonyesa, pollastre arrebossat,
                        patates fregides i postre.
                    </span>
                </label>

            </div>

            <div>

                <label class="flex items-center gap-3 font-semibold">
                    <input id="alergenos" type="checkbox">
                    Tengo alergias o intolerancias
                </label>

                <textarea
                    id="detalleAlergenos"
                    rows="4"
                    class="w-full mt-3 border rounded-lg p-3"
                    placeholder="Indica aquí tus alergias o necesidades alimentarias"></textarea>

            </div>

            <button
                type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg">

                Enviar selección

            </button>

        </form>

        <div
            id="mensaje"
            class="hidden mt-6 bg-green-100 border border-green-300 p-4 rounded-lg">
        </div>

    </div>

    <script>

        const form = document.getElementById('formulario');

        form.addEventListener('submit', async (e) => {

            e.preventDefault();

            const datos = {

                fecha: new Date().toISOString(),

                nombre: document.getElementById('nombre').value,

                entrante:
                    document.querySelector('input[name="entrante"]:checked')?.value,

                principal:
                    document.querySelector('input[name="principal"]:checked')?.value,

                infantil:
                    document.getElementById('infantil').checked,

                alergias:
                    document.getElementById('alergenos').checked,

                observaciones:
                    document.getElementById('detalleAlergenos').value
            };

            localStorage.setItem(
                "ultimaSeleccionMenu",
                JSON.stringify(datos)
            );

            /*
            AQUÍ PEGARÁS MÁS ADELANTE
            LA URL DEL FLUJO DE POWER AUTOMATE

            await fetch("URL_DEL_FLOW", {
                method: "POST",
                headers: {
                    "Content-Type":"application/json"
                },
                body: JSON.stringify(datos)
            });
            */

            const mensaje = document.getElementById('mensaje');

            mensaje.classList.remove('hidden');

            mensaje.innerHTML = `
                ✅ Selección enviada correctamente.<br><br>
                Nombre: <strong>${datos.nombre}</strong><br>
                Entrante: <strong>${datos.entrante}</strong><br>
                Principal: <strong>${datos.principal}</strong>
            `;

            form.reset();

        });

    </script>

</body>

</html>
